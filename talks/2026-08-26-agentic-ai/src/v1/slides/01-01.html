<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>如果 AI 不只回答問題？｜2</title><link rel="stylesheet" href="../theme.css"></head><body class="talk-child"><main class="talk-page"><article class="talk-slide"><header class="talk-head"><span class="chapter-index">CHAPTER 01 · WHY AGENTS</span><h2>如果 AI 不只回答問題，還能把事情做完？</h2><p>生成式 AI 最有趣的下一步，不是再多背一些知識，而是開始和軟體世界互動。</p></header><div class="talk-body"><div class="talk-grid-2"><section class="talk-card"><span class="big">?</span><h3>Chatbot 的終點</h3><p>回答、解釋、建議、產生內容。</p><p><strong>輸出通常是一段文字。</strong></p></section><section class="talk-card orange"><span class="big">✓</span><h3>Agent 的終點</h3><p>查資料、操作工具、反覆修正、交付成果。</p><p><strong>輸出是一個可驗收的任務結果。</strong></p></section></div><div class="talk-callout">關鍵轉變：從「這個答案像不像對的？」走到「這件事是否真的完成？」</div></div></article><footer class="talk-footer"><a href="../index.html" target="_top">返回目錄</a><span>2 / 21</span><span class="page-links"><a href="cover.html">上一頁</a><a href="01-02.html">下一頁</a></span></footer></main><script src="../navigation.js"></script></body></html>
