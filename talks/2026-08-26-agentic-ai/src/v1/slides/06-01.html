<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>學生也能開始做 Agent｜19</title><link rel="stylesheet" href="../theme.css"></head><body class="talk-child"><main class="talk-page"><article class="talk-slide"><header class="talk-head"><span class="chapter-index">CHAPTER 06 · START BUILDING</span><h2>你不需要先訓練模型，才能開始做 Agent</h2></header><div class="talk-body"><div class="talk-numbered"><span class="n">1</span><div><strong>選一個你真的會驗收的小任務</strong><p>例如整理課程資料、查找證據、批次改檔或做一個小遊戲功能。</p></div><span class="n">2</span><div><strong>先定義工具與邊界</strong><p>可以讀什麼、改什麼、何時要問人、最多花多少時間。</p></div><span class="n">3</span><div><strong>把完成條件寫成測試</strong><p>測試、截圖、實際操作、資料核對；不要接受「應該可以」。</p></div><span class="n">4</span><div><strong>記錄失敗，改 Harness</strong><p>讓下一次不是靠運氣，而是沿用已經學到的規則。</p></div></div></div></article><footer class="talk-footer"><a href="../index.html" target="_top">返回目錄</a><span>19 / 21</span><span class="page-links"><a href="05-04.html">上一頁</a><a href="06-02.html">下一頁</a></span></footer></main><script src="../navigation.js"></script></body></html>
