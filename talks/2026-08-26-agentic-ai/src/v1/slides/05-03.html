<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可靠度是系統特性｜17</title><link rel="stylesheet" href="../theme.css"></head><body class="talk-child"><main class="talk-page"><article class="talk-slide"><header class="talk-head"><span class="chapter-index">CHAPTER 05 · BOTTLENECKS</span><h2>服務有回應，不代表 Agent 的工作可靠</h2></header><div class="talk-body"><div class="talk-grid-3"><section class="talk-card green"><h3>Correct</h3><p>任務結果正確，並符合真正的完成條件。</p></section><section class="talk-card orange"><h3>Controlled</h3><p>Agent 只在被允許的資料、工具、權限與預算內行動。</p></section><section class="talk-card purple"><h3>Traceable</h3><p>可以回答它做過什麼、根據什麼、哪一步失敗、誰核准。</p></section></div><div class="talk-callout">可靠度不是模型自己保證的；它來自 Harness、評估、日誌、權限與人工責任共同設計。</div><p class="talk-source">概念取自本場參考簡報：<em>AI's Bottlenecks in the Agentic Era</em>，slide 8。</p></div></article><footer class="talk-footer"><a href="../index.html" target="_top">返回目錄</a><span>17 / 21</span><span class="page-links"><a href="05-02.html">上一頁</a><a href="05-04.html">下一頁</a></span></footer></main><script src="../navigation.js"></script></body></html>
