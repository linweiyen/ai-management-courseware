<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Loop｜6</title><link rel="stylesheet" href="../theme.css"></head><body class="talk-child"><main class="talk-page"><article class="talk-slide"><header class="talk-head"><span class="chapter-index">CHAPTER 02 · AGENT ANATOMY</span><h2>Agent 的核心不是「回答一次」，而是「觀察—行動—檢查」</h2></header><div class="talk-body"><div class="talk-flow"><div class="step"><strong>理解目標</strong><span>成功長什麼樣？</span></div><div class="step"><strong>規劃</strong><span>拆成下一個可執行步驟</span></div><div class="step"><strong>使用工具</strong><span>搜尋、程式、API、檔案</span></div><div class="step"><strong>觀察結果</strong><span>系統實際回傳了什麼？</span></div><div class="step"><strong>評估</strong><span>完成、重試、換路或求助</span></div></div><div class="talk-callout">每多跑一步，就多一次成本與失敗機會；但也多一次發現錯誤並修正的機會。</div></div></article><footer class="talk-footer"><a href="../index.html" target="_top">返回目錄</a><span>6 / 20</span><span class="page-links"><a href="02-01.html">上一頁</a><a href="02-03.html">下一頁</a></span></footer></main><script src="../navigation.js"></script></body></html>
