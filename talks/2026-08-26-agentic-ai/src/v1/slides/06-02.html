<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic AI 的真正能力｜20</title><link rel="stylesheet" href="../theme.css"></head><body class="talk-child"><main class="talk-page"><article class="talk-slide talk-close"><header class="talk-head"><span class="chapter-index">CHAPTER 06 · TAKEAWAY</span><h2>最後帶走一件事</h2></header><div class="talk-body"><div class="thesis">Agentic AI 的真正能力，不只來自模型；<br>更來自我們如何設計它的 <em>工作、工具、邊界與證據</em>。</div><div class="talk-grid-3" style="width:min(100%,1050px);margin-top:32px;text-align:left"><section class="talk-card"><h3>Build</h3><p>把想法拆成能執行的系統。</p></section><section class="talk-card orange"><h3>Measure</h3><p>用真實結果，而不是印象驗收。</p></section><section class="talk-card green"><h3>Take responsibility</h3><p>能力可以委派，責任不能消失。</p></section></div></div></article><footer class="talk-footer"><a href="../index.html" target="_top">返回目錄</a><span>20 / 21</span><span class="page-links"><a href="06-01.html">上一頁</a><a href="appendix-01.html">來源</a></span></footer></main><script src="../navigation.js"></script></body></html>
