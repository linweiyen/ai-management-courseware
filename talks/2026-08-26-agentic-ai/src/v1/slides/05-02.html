<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compute 與 Inference｜16</title><link rel="stylesheet" href="../theme.css"></head><body class="talk-child"><main class="talk-page"><article class="talk-slide"><header class="talk-head"><span class="chapter-index">CHAPTER 05 · BOTTLENECKS</span><h2>一次對話可能只呼叫一次模型；一個 Agent 任務可能呼叫很多次</h2></header><div class="talk-body"><div class="talk-compare"><section class="talk-card"><h3>Chatbot</h3><div class="talk-equation" style="font-size:clamp(1.3rem,2.8vw,2.7rem)">1 次主要推論</div><p>輸入 → 回答</p></section><div class="talk-vs">VS</div><section class="talk-card orange"><h3>Agent</h3><div class="talk-flow"><div class="step"><strong>規劃</strong></div><div class="step"><strong>工具</strong></div><div class="step"><strong>檢查</strong></div><div class="step"><strong>重試</strong></div></div><p>每一步都消耗 Token、時間與服務容量。</p></section></div><div class="talk-callout">所以要衡量的不是「每百萬 Token 多少錢」，而是「完成一個正確任務需要多少總成本與時間」。</div></div></article><footer class="talk-footer"><a href="../index.html" target="_top">返回目錄</a><span>16 / 21</span><span class="page-links"><a href="05-01.html">上一頁</a><a href="05-03.html">下一頁</a></span></footer></main><script src="../navigation.js"></script></body></html>
