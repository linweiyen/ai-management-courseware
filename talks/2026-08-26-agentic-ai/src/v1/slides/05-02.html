<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIDMS 如何接住算力與推論的瓶頸｜16</title><link rel="stylesheet" href="../theme.css"></head><body class="talk-child"><main class="talk-page"><article class="talk-slide dense-slide"><header class="talk-head"><span class="chapter-index">CHAPTER 05 · AIDMS IN PRACTICE</span><h2>AIDMS 如何接住算力與推論的瓶頸</h2></header><div class="talk-body"><div class="talk-grid-2"><section class="talk-card"><span class="big">01</span><h3>資源池</h3><p>把 GPU、CPU、儲存與網路納入同一個可管理的資源池。</p></section><section class="talk-card orange"><span class="big">02</span><h3>模型服務</h3><p>管理模型版本、部署、路由、擴縮與服務可用性。</p></section><section class="talk-card purple"><span class="big">03</span><h3>排程與配額</h3><p>面對多團隊、多 Agent 與尖峰需求，安排優先順序與使用額度。</p></section><section class="talk-card green"><span class="big">04</span><h3>監控與觀測</h3><p>掌握延遲、吞吐、錯誤、Token 與實際使用成本。</p></section></div><div class="talk-callout">Agent 每多跑一步，就多消耗一次服務容量；AIDMS 把這些容量變成可調度、可觀測的企業服務。</div></div></article><footer class="talk-footer"><a href="../index.html" target="_top">返回目錄</a><span>16 / 20</span><span class="page-links"><a href="05-01.html">上一頁</a><a href="05-03.html">下一頁</a></span></footer></main><script src="../navigation.js"></script></body></html>
