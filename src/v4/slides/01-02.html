<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 能力演進｜v4 5</title><link rel="stylesheet" href="../theme.css"></head><body class="v4-child"><main class="v4-page"><article class="chapter"><header class="chapter-head"><span class="chapter-index">CHAPTER 01</span><h2>為什麼現在要學：採用正在增加，落差也在擴大</h2><p>理解 AI 從辨識、生成到推理與行動的發展，才能看懂今天企業面對的變化。</p></header><div class="chapter-body"><h3>AI 發展脈絡：從辨識、生成到自主協作</h3><p>早期 AI 主要處理辨識與分類，接著進入語言與內容生成，近年則逐步走向推理、工具使用與 Agent 協作。技術能力的增加，也讓工作影響從單一任務逐步延伸到流程設計與管理責任。</p><figure class="card"><img src="../assets/ai-development-timeline.png" alt="AI 從感知與辨識、生成與語言統一、推理與行動到自主編排的發展時間軸" style="display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)"><figcaption><strong>AI 發展時間軸：</strong>由感知與辨識、生成與語言統一，發展到推理、行動與自主編排。</figcaption></figure></div></article><footer class="v4-footer"><a href="../index.html" target="_top">返回教材目錄</a><span>5 / 49</span><span class="page-links"><a href="01-01.html">上一頁</a><a href="01-03.html">下一頁</a></span></footer></main><script>document.body.classList.toggle('embedded',window.self!==window.top);</script><script src="../navigation.js"></script></body></html>
