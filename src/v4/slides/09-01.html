<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>從單輪問答到 Agent：能力增加，成本與責任也增加｜v4 36</title><link rel="stylesheet" href="../theme.css"><style>.inference-figure{margin:0 auto;max-width:1040px}.inference-figure svg{display:block;width:100%;height:auto;border-radius:18px}</style></head><body class="v4-child"><main class="v4-page"><article class="chapter exact-fragment" data-source-chapter="agent"><header class="chapter-head"><span class="chapter-index">CHAPTER 07</span><h2>從清楚指令到可管理的 Agent</h2>
      <p>指令越清楚，工作越容易驗收；當 AI 能讀取資料、使用工具並採取多步驟行動，權限與控制也必須同步升級。</p></header><div class="chapter-body"><h3>Agentic AI 改變了推理經濟學</h3><p class="lead">同一個問題，若交給 Agent 完成，成本不再只是一次回答的費用，而是完成一個通過驗證的任務所需的全部嘗試。</p><figure class="inference-figure" aria-label="Chat 與 Agent 的推理流程與成本指標"><svg viewBox="0 0 1040 610" role="img" aria-labelledby="s5-svg-title s5-svg-desc"><title id="s5-svg-title">Chat 與 Agent 的推理流程</title><desc id="s5-svg-desc">Chat 是 Prompt 到 Answer 的單輪流程；Agent 則經過 Plan、Retrieve、Act、Observe、Verify，必要時 Retry，直到通過驗證。</desc><defs><linearGradient id="s5-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07172b"/><stop offset="1" stop-color="#102e4c"/></linearGradient><marker id="s5-arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2fb8c6"/></marker><marker id="s5-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f08a4b"/></marker></defs><rect width="1040" height="610" rx="24" fill="url(#s5-bg)"/><text x="56" y="58" fill="#8ce0e6" font-size="16" font-weight="700" letter-spacing="2">AGENTIC AI CHANGES INFERENCE ECONOMICS</text><g transform="translate(54 92)"><rect width="384" height="335" rx="20" fill="#0d2842" stroke="#31506a"/><text x="28" y="43" fill="#ffffff" font-size="24" font-weight="700">CHAT</text><text x="28" y="70" fill="#8faabe" font-size="14">one prompt → one inference → one answer</text><rect x="38" y="113" width="116" height="62" rx="13" fill="#173d58" stroke="#2fb8c6"/><rect x="230" y="113" width="116" height="62" rx="13" fill="#173d58" stroke="#2fb8c6"/><line x1="159" y1="144" x2="222" y2="144" stroke="#2fb8c6" stroke-width="3" marker-end="url(#s5-arrow-cyan)"/><text x="96" y="151" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Prompt</text><text x="288" y="151" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">Answer</text><circle cx="192" cy="144" r="23" fill="#2fb8c6"/><text x="192" y="151" fill="#07172b" font-size="13" font-weight="800" text-anchor="middle">1×</text><path d="M38 223H346" stroke="#31506a"/><text x="38" y="258" fill="#8ce0e6" font-size="15" font-weight="700">PRIMARY UNIT</text><text x="38" y="292" fill="#ffffff" font-size="24" font-weight="700">Cost per response</text><text x="38" y="318" fill="#a9bccb" font-size="14">適合回答型、低風險、一次性任務</text></g><g transform="translate(464 92)"><rect width="522" height="335" rx="20" fill="#0d2842" stroke="#70452d"/><text x="28" y="43" fill="#ffffff" font-size="24" font-weight="700">AGENT</text><text x="28" y="70" fill="#b8a390" font-size="14">inference is consumed across a task loop</text><g fill="#173d58" stroke="#f08a4b"><rect x="38" y="108" width="92" height="56" rx="12"/><rect x="157" y="108" width="92" height="56" rx="12"/><rect x="276" y="108" width="92" height="56" rx="12"/><rect x="395" y="108" width="92" height="56" rx="12"/><rect x="276" y="205" width="92" height="56" rx="12"/><rect x="157" y="205" width="92" height="56" rx="12"/></g><g fill="#fff" font-size="14" font-weight="700" text-anchor="middle"><text x="84" y="142">Plan</text><text x="203" y="142">Retrieve</text><text x="322" y="142">Act</text><text x="441" y="142">Observe</text><text x="322" y="239">Verify</text><text x="203" y="239">Retry</text></g><g fill="none" stroke="#f08a4b" stroke-width="3" marker-end="url(#s5-arrow-orange)"><line x1="132" y1="136" x2="149" y2="136"/><line x1="251" y1="136" x2="268" y2="136"/><line x1="370" y1="136" x2="387" y2="136"/><path d="M441 166V186Q441 205 422 205H376"/><line x1="274" y1="233" x2="257" y2="233"/><path d="M157 233H116Q84 233 84 201V172"/></g><rect x="391" y="206" width="96" height="55" rx="12" fill="#173d58" stroke="#4e9b77"/><text x="439" y="229" fill="#9dd4b9" font-size="12" font-weight="700" text-anchor="middle">PASS</text><text x="439" y="248" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Done</text><line x1="370" y1="233" x2="383" y2="233" stroke="#4e9b77" stroke-width="3" marker-end="url(#s5-arrow-cyan)"/><text x="38" y="299" fill="#f6c3a4" font-size="15" font-weight="700">EACH LOOP ADDS</text><text x="38" y="325" fill="#c9d8e5" font-size="14">tokens · tools · latency · failure surface · human attention</text></g><g transform="translate(54 459)"><rect width="932" height="105" rx="18" fill="#f5f1e8"/><text x="28" y="35" fill="#5d6a78" font-size="14" font-weight="700">METRIC SHIFT</text><text x="28" y="72" fill="#142133" font-size="25" font-weight="700">Cost / 1M tokens</text><path d="M300 59H414" stroke="#f08a4b" stroke-width="4" marker-end="url(#s5-arrow-orange)"/><text x="448" y="72" fill="#087c8b" font-size="25" font-weight="800">Cost / successful, verified task</text><text x="448" y="94" fill="#5d6a78" font-size="13">all attempts included · only accepted outcomes counted</text></g></svg></figure><div class="callout"><strong>管理上的重點：</strong>Agent 的成本與風險，應以「通過驗證的任務」衡量，而不只是每百萬 tokens 的單價。</div></div></article><footer class="v4-footer"><a href="../index.html" target="_top">回到章節總覽</a><span>36 / 49</span><span class="page-links"><a href="08-04.html">上一頁</a><a href="09-03.html">下一頁</a></span></footer></main><script>document.body.classList.toggle('embedded',window.self!==window.top);</script></body></html>
